<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0505"/>
      <stop offset="70%" stop-color="#0a0202"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400,400)" filter="url(#glow)" fill="none" stroke="#c41e1a" stroke-width="2.5" opacity="0.85">
    <circle r="180"/>
    <circle r="155" stroke-width="1.5" opacity="0.7"/>
    <circle r="130" stroke-width="1" opacity="0.5"/>
    <!-- spiral -->
    <path d="M0,-20 Q40,-40 60,0 Q40,40 0,50 Q-50,40 -60,0 Q-40,-50 0,-70 Q70,-60 90,0 Q70,80 0,100 Q-90,80 -110,0 Q-80,-100 0,-120 Q120,-100 140,0" stroke-width="2"/>
    <circle r="25" stroke-width="2"/>
    <circle r="12" fill="#c41e1a" stroke="none" opacity="0.6"/>
  </g>
  <!-- runes around -->
  <g fill="#c41e1a" font-family="serif" font-size="18" opacity="0.7" text-anchor="middle">
    <text x="400" y="195">ᚠ</text>
    <text x="520" y="240">ᚢ</text>
    <text x="580" y="340">ᚦ</text>
    <text x="560" y="460">ᚨ</text>
    <text x="480" y="540">ᚱ</text>
    <text x="360" y="560">ᚲ</text>
    <text x="260" y="500">ᚷ</text>
    <text x="210" y="400">ᚹ</text>
    <text x="230" y="290">ᚺ</text>
    <text x="310" y="220">ᚾ</text>
  </g>
</svg>