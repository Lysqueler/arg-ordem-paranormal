<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <mask id="hole">
      <rect width="200" height="200" fill="white"/>
      <circle cx="100" cy="100" r="42" fill="black"/>
    </mask>
  </defs>
  <g mask="url(#hole)">
    <!-- 5 segments of 72deg each, colors matching user image -->
    <path d="M100,100 L100,8 A92,92 0 0,1 187.5,71.5 Z" fill="#9e3d4a"/>
    <path d="M100,100 L187.5,71.5 A92,92 0 0,1 155.5,176.5 Z" fill="#7a2f36"/>
