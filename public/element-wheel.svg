    <path d="M100,100 L12.5,71.5 A92,92 0 0,1 100,8 Z" fill="#c4788a"/>
  </g>
  <!-- subtle segment gaps -->
  <g stroke="white" stroke-width="3" stroke-linecap="round">
    <line x1="100" y1="100" x2="100" y2="8"/>
    <line x1="100" y1="100" x2="187.5" y2="71.5"/>
    <line x1="100" y1="100" x2="155.5" y2="176.5"/>
    <line x1="100" y1="100" x2="44.5" y2="176.5"/>
